<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f8ff;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-top: 5px solid #007bff;
            text-align: left;
            min-width: 300px;
        }
        h1 {
            color: #007bff;
            text-align: center;
            margin-top: 0;
        }
        p {
            margin: 10px 0;
        }
        .label {
            font-weight: bold;
            color: #555;
        }
        .btn-logout {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            margin-top: 20px;
            box-sizing: border-box;
        }
        .btn-logout:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Home</h1>

    <p>
        <span class="label">Username:</span>
        <span th:text="${user.username}"></span>
    </p>

    <p>
        <span class="label">Nama:</span>
        <span th:text="${profile.nama}"></span>
    </p>

    <p>
        <span class="label">Alamat:</span>
        <span th:text="${profile.alamat}"></span>
    </p>

    <a th:href="@{/logout}" class="btn-logout">
        Logout
    </a>
</div>

</body>
</html>
